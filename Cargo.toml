[package]
name = "hoop-craft"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", features = ["wayland"] }
bevy_vrm1 = "0.5"
avian3d = "0.5"
bevy_kira_audio = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

# Faster compile times in dev
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
